name: LumenMobile
options:
  bundleIdPrefix: com.lumen
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
targets:
  LumenMobile:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/LumenMobile.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lumen.mobile
      INFOPLIST_FILE: Resources/Info.plist
      ENABLE_BITCODE: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: YES
